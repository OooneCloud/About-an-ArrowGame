<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A97A5"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="18" font-weight="bold" fill="#34424A">一箭又一箭 · 游戏流程状态图（示意）</text>

  <!-- ============ 节点 ============ -->
  <!-- N1 开始界面 -->
  <rect x="60" y="48" width="200" height="64" rx="12" fill="#EAF2FF" stroke="#4285F4" stroke-width="2"/>
  <text x="160" y="76" font-size="17" font-weight="bold" fill="#1A3C8F" text-anchor="middle">开始界面</text>
  <text x="160" y="97" font-size="12" fill="#5A6B7C" text-anchor="middle">标题 · 规则 · 开始按钮</text>

  <!-- N2 游戏界面 -->
  <rect x="380" y="48" width="220" height="64" rx="12" fill="#EAF2FF" stroke="#4285F4" stroke-width="2"/>
  <text x="490" y="76" font-size="17" font-weight="bold" fill="#1A3C8F" text-anchor="middle">游戏界面</text>
  <text x="490" y="97" font-size="12" fill="#5A6B7C" text-anchor="middle">HUD：关卡 / 生命 / 时间</text>

  <!-- N3 碰撞反馈 -->
  <rect x="90" y="250" width="230" height="64" rx="12" fill="#FDECEA" stroke="#E74C3C" stroke-width="2"/>
  <text x="205" y="278" font-size="16" font-weight="bold" fill="#B03A2E" text-anchor="middle">碰撞反馈 · 生命 -1</text>
  <text x="205" y="299" font-size="12" fill="#7A4A44" text-anchor="middle">箭头晃动 + 红色提示文字</text>

  <!-- N4 失败界面 -->
  <rect x="90" y="440" width="230" height="64" rx="12" fill="#FDECEA" stroke="#E74C3C" stroke-width="2"/>
  <text x="205" y="468" font-size="16" font-weight="bold" fill="#B03A2E" text-anchor="middle">失败界面</text>
  <text x="205" y="489" font-size="12" fill="#7A4A44" text-anchor="middle">生命耗尽 / 限时耗尽</text>

  <!-- N5 箭头飞出 -->
  <rect x="420" y="250" width="230" height="64" rx="12" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="535" y="278" font-size="16" font-weight="bold" fill="#1E8449" text-anchor="middle">箭头飞出 · 消除</text>
  <text x="535" y="299" font-size="12" fill="#3E7A54" text-anchor="middle">滑出动画</text>

  <!-- N6 通关界面 -->
  <rect x="680" y="250" width="230" height="64" rx="12" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="795" y="278" font-size="16" font-weight="bold" fill="#1E8449" text-anchor="middle">通关界面</text>
  <text x="795" y="299" font-size="12" fill="#3E7A54" text-anchor="middle">剩余箭头 = 0 · 评定星级</text>

  <!-- N7 全部通关 -->
  <rect x="680" y="440" width="230" height="64" rx="12" fill="#FFF8E1" stroke="#F39C12" stroke-width="2"/>
  <text x="795" y="468" font-size="16" font-weight="bold" fill="#B9770E" text-anchor="middle">全部通关界面</text>
  <text x="795" y="489" font-size="12" fill="#8A6D1D" text-anchor="middle">最后一关通关</text>

  <!-- ============ 连线 ============ -->
  <!-- N1 -> N2 -->
  <line x1="260" y1="80" x2="380" y2="80" stroke="#8A97A5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="70" font-size="13" fill="#5A6B7C" text-anchor="middle">点击「开始游戏」</text>

  <!-- N2 -> N3 (被阻挡) -->
  <path d="M 430 112 L 430 170 L 205 170 L 205 250" fill="none" stroke="#8A97A5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="160" font-size="13" fill="#B03A2E" text-anchor="middle">点击被阻挡的箭头</text>

  <!-- N2 -> N5 (无阻挡) -->
  <path d="M 520 112 L 520 170 L 535 170 L 535 250" fill="none" stroke="#8A97A5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="150" font-size="13" fill="#1E8449" text-anchor="middle">点击无阻挡的箭头</text>

  <!-- N2 -> N4 超时失败 -->
  <path d="M 420 112 L 420 160 L 70 160 L 70 440 L 90 440" fill="none" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="186" font-size="13" fill="#B03A2E" text-anchor="middle">限时耗尽（超时）</text>

  <!-- N3 -> N4 -->
  <line x1="205" y1="314" x2="205" y2="440" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="380" font-size="13" fill="#B03A2E">生命值耗尽</text>

  <!-- N4 -> N2 重新开始（虚线） -->
  <path d="M 320 472 L 370 472 L 370 200 L 470 200 L 470 112" fill="none" stroke="#8A97A5" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="402" y="238" font-size="13" fill="#5A6B7C" text-anchor="middle">重新开始（恢复本关）</text>

  <!-- N5 -> N6 -->
  <line x1="650" y1="282" x2="680" y2="282" stroke="#2ECC71" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="272" font-size="13" fill="#1E8449" text-anchor="middle">剩余箭头 = 0</text>

  <!-- N6 -> N2 下一关 -->
  <path d="M 795 250 L 795 170 L 590 170 L 590 112" fill="none" stroke="#2ECC71" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="160" font-size="13" fill="#1E8449" text-anchor="middle">「下一关」进入下一关</text>

  <!-- N6 -> N7 -->
  <line x1="795" y1="314" x2="795" y2="440" stroke="#F39C12" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="380" font-size="13" fill="#B9770E">最后一关通关</text>

  <!-- N7 -> N1 返回首页（虚线） -->
  <path d="M 680 472 L 620 472 L 620 560 L 40 560 L 40 80 L 60 80" fill="none" stroke="#8A97A5" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="330" y="550" font-size="13" fill="#5A6B7C" text-anchor="middle">点击「返回首页」</text>

  <!-- 补充说明 -->
  <text x="490" y="610" font-size="13" fill="#8A97A5" text-anchor="middle">界面右上角「重新开始」按钮可随时重置当前关卡；棋盘下方有撤销/提示/AI求解功能；通关后等最后一个箭头飞出棋盘再显示结果，并按用时、生命消耗、撤销与提示次数评定 1~5 颗星（使用 AI 求解直接 1 星）；所有关卡均已通过可解性求解器校验。</text>
</svg>
